<title>the pull against the push</title>
<desc>log-log chart of the sun's pull against orbit radius. the starter's push of 0.002 m/s² crosses the pull at 1.72 AU, so every station inside, the outpost included, lies in the stuck zone. maneuver.mk2 crosses at 0.99 AU. the beam stays above the pull everywhere.</desc>
