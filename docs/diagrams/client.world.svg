<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img">
<title>world layers</title>
<desc>five layers from back to front: sky shader, painted plate, 3D objects, painted front sprites, the html kit.</desc>
<style>
text { font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; dominant-baseline: central }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A }
.ts { font-size: 12px; fill: #5F5E5A }
rect { stroke-width: .5 }
.arr { stroke: #888780; stroke-width: 1.5; fill: none }
.box { fill: none; stroke: #888780; stroke-width: .5; stroke-dasharray: 4 4 }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A } .gray .th { fill: #444441 } .gray .ts { fill: #5F5E5A }
.teal rect { fill: #E1F5EE; stroke: #0F6E56 } .teal .th { fill: #085041 } .teal .ts { fill: #0F6E56 }
.purple rect { fill: #EEEDFE; stroke: #534AB7 } .purple .th { fill: #3C3489 } .purple .ts { fill: #534AB7 }
.coral rect { fill: #FAECE7; stroke: #993C1D } .coral .th { fill: #712B13 } .coral .ts { fill: #993C1D }
@media (prefers-color-scheme: dark) {
  .th { fill: #F1EFE8 } .ts { fill: #D3D1C7 }
  .gray rect { fill: #444441; stroke: #D3D1C7 } .gray .th { fill: #F1EFE8 } .gray .ts { fill: #D3D1C7 }
  .teal rect { fill: #085041; stroke: #9FE1CB } .teal .th { fill: #E1F5EE } .teal .ts { fill: #9FE1CB }
  .purple rect { fill: #3C3489; stroke: #CECBF6 } .purple .th { fill: #EEEDFE } .purple .ts { fill: #CECBF6 }
  .coral rect { fill: #712B13; stroke: #F5C4B3 } .coral .th { fill: #FAECE7 } .coral .ts { fill: #F5C4B3 }
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gray"><rect x="40" y="40" width="380" height="100" rx="8"/><text class="th" x="56" y="57">sky</text><text class="ts" x="56" y="76">shader: ether, stars, planet</text></g>
<g class="coral"><rect x="80" y="90" width="380" height="100" rx="8"/><text class="th" x="96" y="107">plate</text><text class="ts" x="96" y="126">painted sprites, back</text></g>
<g class="purple"><rect x="120" y="140" width="380" height="100" rx="8"/><text class="th" x="136" y="157">3D</text><text class="ts" x="136" y="176">ships, robots, containers</text></g>
<g class="coral"><rect x="160" y="190" width="380" height="100" rx="8"/><text class="th" x="176" y="207">front</text><text class="ts" x="176" y="226">painted sprites, front</text></g>
<g class="gray"><rect x="200" y="240" width="380" height="100" rx="8"/><text class="th" x="216" y="257">dom</text><text class="ts" x="216" y="276">the kit: cards, labels, hud</text></g>
<text class="ts" x="40" y="372">back to front · coral: painted sprites · purple: 3D · gray: shader and html</text>
</svg>
