<svg xmlns="http://www.w3.org/2000/svg" width="680" height="328" viewBox="0 0 680 328" role="img">
<title>client loop</title>
<desc>a command goes out with a ghost, the event comes back on the feed, fold makes a new session, effects and a refresh.</desc>
<style>
text { font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; dominant-baseline: central }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A }
.ts { font-size: 12px; fill: #5F5E5A }
rect { stroke-width: .5 }
.arr { stroke: #888780; stroke-width: 1.5; fill: none }
.box { fill: none; stroke: #888780; stroke-width: .5; stroke-dasharray: 4 4 }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A } .gray .th { fill: #444441 } .gray .ts { fill: #5F5E5A }
.teal rect { fill: #E1F5EE; stroke: #0F6E56 } .teal .th { fill: #085041 } .teal .ts { fill: #0F6E56 }
.purple rect { fill: #EEEDFE; stroke: #534AB7 } .purple .th { fill: #3C3489 } .purple .ts { fill: #534AB7 }
.coral rect { fill: #FAECE7; stroke: #993C1D } .coral .th { fill: #712B13 } .coral .ts { fill: #993C1D }
@media (prefers-color-scheme: dark) {
  .th { fill: #F1EFE8 } .ts { fill: #D3D1C7 }
  .gray rect { fill: #444441; stroke: #D3D1C7 } .gray .th { fill: #F1EFE8 } .gray .ts { fill: #D3D1C7 }
  .teal rect { fill: #085041; stroke: #9FE1CB } .teal .th { fill: #E1F5EE } .teal .ts { fill: #9FE1CB }
  .purple rect { fill: #3C3489; stroke: #CECBF6 } .purple .th { fill: #EEEDFE } .purple .ts { fill: #CECBF6 }
  .coral rect { fill: #712B13; stroke: #F5C4B3 } .coral .th { fill: #FAECE7 } .coral .ts { fill: #F5C4B3 }
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="purple"><rect x="40" y="40" width="180" height="56" rx="8"/><text class="th" x="130" y="59" text-anchor="middle">player acts</text><text class="ts" x="130" y="78" text-anchor="middle">in a place</text></g>
<g class="teal"><rect x="250" y="40" width="180" height="56" rx="8"/><text class="th" x="340" y="59" text-anchor="middle">command</text><text class="ts" x="340" y="78" text-anchor="middle">a ghost shows it</text></g>
<g class="gray"><rect x="460" y="40" width="180" height="56" rx="8"/><text class="th" x="550" y="59" text-anchor="middle">gateway</text><text class="ts" x="550" y="78" text-anchor="middle">replies 202</text></g>
<line class="arr" x1="222" y1="68" x2="248" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="432" y1="68" x2="458" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="550" y1="98" x2="550" y2="134" marker-end="url(#arrow)"/>
<g class="gray"><rect x="460" y="136" width="180" height="56" rx="8"/><text class="th" x="550" y="155" text-anchor="middle">feed</text><text class="ts" x="550" y="174" text-anchor="middle">websocket event</text></g>
<g class="teal"><rect x="250" y="136" width="180" height="56" rx="8"/><text class="th" x="340" y="155" text-anchor="middle">fold</text><text class="ts" x="340" y="174" text-anchor="middle">event → new session</text></g>
<line class="arr" x1="458" y1="164" x2="432" y2="164" marker-end="url(#arrow)"/>
<path class="arr" d="M300 194 V212 H130 V230" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="194" x2="340" y2="230" marker-end="url(#arrow)"/>
<path class="arr" d="M380 194 V212 H550 V230" marker-end="url(#arrow)"/>
<g class="teal"><rect x="40" y="232" width="180" height="56" rx="8"/><text class="th" x="130" y="251" text-anchor="middle">session</text><text class="ts" x="130" y="270" text-anchor="middle">places sync</text></g>
<g class="purple"><rect x="250" y="232" width="180" height="56" rx="8"/><text class="th" x="340" y="251" text-anchor="middle">effects</text><text class="ts" x="340" y="270" text-anchor="middle">animate the world</text></g>
<g class="teal"><rect x="460" y="232" width="180" height="56" rx="8"/><text class="th" x="550" y="251" text-anchor="middle">refresh</text><text class="ts" x="550" y="270" text-anchor="middle">rest reads again</text></g>
<line class="arr" x1="80" y1="230" x2="80" y2="98" marker-end="url(#arrow)"/>
</svg>
